name: C008 unprotected relay

on:
  repository_dispatch:
    types:
      - c008-direct
      - c008-relay

permissions:
  contents: read
  statuses: write

jobs:
  direct-observer:
    if: github.event.action == 'c008-direct'
    runs-on: ubuntu-latest
    steps:
      - name: Prove the direct dispatch was delivered
        env:
          TRIAL: ${{ github.event.client_payload.trial }}
        run: |
          set -euo pipefail
          test "$TRIAL" = c008-direct-20261001-v2
          echo "C008_DIRECT_DISPATCH_ADMITTED=$TRIAL"

  relay-control:
    if: github.event.action == 'c008-relay'
    runs-on: ubuntu-latest
    steps:
      - name: Prove the untargeted relay was admitted
        env:
          TRIAL: ${{ github.event.client_payload.trial }}
        run: |
          set -euo pipefail
          test "$TRIAL" = c008-relay-20261001-v2
          echo "C008_RELAY_ADMITTED=$TRIAL"

  call-protected:
    if: github.event.action == 'c008-relay'
    needs: relay-control
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/c008-protected.yml
    with:
      trial: ${{ github.event.client_payload.trial }}
